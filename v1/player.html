<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riitm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Riitm — Midnight Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Shared tokens & device frame ───────── */
:root{
  --bg:#0B0C10; --card:#14161D; --card-2:#1A1D26; --field:#0F1116;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F4F6F8; --muted:#8C93A1; --dim:#5D6370;
  --lime:#B6FF38; --lime-brand:#9DFF00; --blue:#0062FF; --ink:#000B1C;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Archivo','Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --accent:var(--lime); --accent-2:var(--blue);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0B0C10}
body{height:100vh;height:100dvh;overflow:hidden;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.stage-bg canvas{display:block;width:100%;height:100%}
.stage-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 48%,rgba(11,12,16,.6),rgba(11,12,16,0) 75%)}
.device-wrap{position:relative;z-index:1;width:410px;height:864px;flex:none}
.device{position:absolute;left:0;top:0;width:410px;height:864px;padding:10px;border-radius:60px;
  background:linear-gradient(150deg,#3b3e47,#121318 28%,#0a0b0e 70%,#2b2e36);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 50px 120px -30px rgba(0,0,0,.9),0 0 0 1px #000;
  transform:scale(var(--scale,1));transform-origin:0 0}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);isolation:isolate}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;padding:17px 30px 0 38px;display:flex;justify-content:space-between;font:600 15px var(--fb);letter-spacing:-.01em;position:relative;z-index:5}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:60;pointer-events:none}
.hdr{flex:none;height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{display:block;height:24px}
.logo svg{height:24px;width:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s var(--ease)}
.icon-btn:hover{background:rgba(255,255,255,.07)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(11,12,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.toolbar a,.toolbar button{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--fb);color:var(--muted);text-decoration:none;transition:color .2s,background .2s;white-space:nowrap}
.toolbar a:hover,.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.toolbar a.on{background:var(--lime);color:#0B0C10}
.toolbar .n{font-variant-numeric:tabular-nums;opacity:.55}
.toolbar .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.toolbar svg{width:15px;height:15px}
.toast{position:absolute;left:50%;bottom:112px;z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:86%;
  padding:11px 16px;border-radius:16px;background:rgba(26,29,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);font:500 13px var(--fb);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transition:opacity .3s,transform .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex:none}
.reveal{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0) * 75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
body.leaving .app{animation:leave .42s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes waveSlide{to{transform:translateX(var(--p))}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .stage{display:block}
  .stage-bg,.toolbar,.statusbar,.homebar{display:none}
  .device-wrap{width:100%!important;height:100%!important}
  .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{border-radius:0}
  .app{padding-top:max(env(safe-area-inset-top),8px);padding-bottom:env(safe-area-inset-bottom)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ───────── Page 3: Player ───────── */
body.var{--accent:#FF3D75;--accent-2:#8A03FF}
.ambient{position:absolute;left:50%;top:-80px;width:560px;height:560px;transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent-2) 38%,transparent),transparent 65%);filter:blur(10px);opacity:.75;transition:opacity .6s}
.scroll{position:relative;z-index:1;padding-bottom:28px}
.art-wrap{position:relative;width:276px;margin:4px auto 0;perspective:900px}
.art{position:relative;width:276px;height:276px;border-radius:24px;overflow:hidden;transform-style:preserve-3d;transition:transform .5s var(--ease);
  box-shadow:0 30px 60px -22px color-mix(in srgb,var(--accent-2) 70%,transparent),0 0 0 1px rgba(255,255,255,.08)}
.art svg{width:100%;height:100%}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 38%,transparent 70%,rgba(255,255,255,.05))}
.unmute{position:absolute;left:50%;bottom:14px;transform:translate(-50%,0);z-index:3;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;
  background:rgba(11,12,16,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);font:600 12px var(--fb);transition:opacity .4s,transform .4s var(--ease)}
.unmute svg{width:16px;height:16px;color:var(--accent)}
.unmute.hide{opacity:0;transform:translate(-50%,8px);pointer-events:none}
.badge{display:none;margin:18px auto -8px;width:max-content;height:24px;padding:0 10px;border-radius:999px;font:600 10.5px/24px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
body.var .badge{display:block}
.title{text-align:center;margin-top:18px}
.title h1{font:800 27px/1.1 var(--fd);font-stretch:110%;letter-spacing:-.015em}
.title p{margin-top:7px;font:500 13px var(--fb);color:var(--muted);display:flex;justify-content:center;gap:9px}
.title p i{font-style:normal;opacity:.5}

.wave{position:relative;margin:16px 22px 0;height:46px;cursor:pointer;touch-action:none}
.wave canvas{width:100%;height:100%;display:block}
.times{display:flex;justify-content:space-between;margin:6px 22px 0;font:500 12px var(--fb);color:var(--muted);font-variant-numeric:tabular-nums}

.controls{display:flex;align-items:center;justify-content:space-between;margin:8px 22px 0}
.ctl{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#E6E9EE;transition:color .2s,transform .2s var(--ease),background .2s;position:relative}
.ctl:hover{background:rgba(255,255,255,.05)}
.ctl:active{transform:scale(.88)}
.ctl svg{width:24px;height:24px}
.ctl.fill svg{width:26px;height:26px;fill:currentColor;stroke:none}
.ctl.toggle{color:var(--muted)}
.ctl.toggle.on{color:var(--accent)}
.ctl.toggle.on::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.play{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--ease)}
.play:active{transform:scale(.93)}
.play .ring{position:absolute;inset:0;width:80px;height:80px;transform:rotate(-90deg)}
.play .core{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#1D212B,#111319);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -8px color-mix(in srgb,var(--accent) 45%,transparent)}
.play .core svg{width:26px;height:26px;fill:#fff;position:absolute;transition:opacity .25s,transform .35s var(--ease)}
.play .i-play{transform:translateX(2px) scale(.4);opacity:0}
.play.paused .i-play{transform:translateX(2px);opacity:1}
.play.paused .i-pause{transform:scale(.4);opacity:0}

.actions{display:flex;justify-content:space-between;margin:16px 26px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;width:62px;font:500 12px var(--fb);color:#C9CED6}
.act .c{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(255,255,255,.025);transition:transform .25s var(--ease),background .25s,border-color .25s,color .25s}
.act:hover .c{background:rgba(255,255,255,.06)}
.act:active .c{transform:scale(.9)}
.act .c svg{width:22px;height:22px}
.act.on .c{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.act.on .c .heart{fill:var(--accent)}
.act .c .heart{transition:fill .25s}
.act.pop .c{animation:popc .5s var(--ease)}
@keyframes popc{35%{transform:scale(1.18)}}
.burst{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--accent);pointer-events:none;animation:burst .6s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.dl-ring{position:absolute;inset:-1px;width:54px;height:54px;transform:rotate(-90deg);opacity:0;transition:opacity .2s}
.act.loading .dl-ring{opacity:1}

.var-card{display:flex;align-items:center;gap:14px;width:calc(100% - 28px);margin:18px 14px 0;padding:12px 14px;border-radius:20px;text-align:left;
  background:linear-gradient(180deg,#171A23,#12141A);border:1px solid var(--line);transition:border-color .25s,transform .25s var(--ease)}
.var-card:hover{border-color:var(--line-2)}
.var-card:active{transform:scale(.98)}
.var-card .vi{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.04)}
.var-card .vi i{width:3px;border-radius:2px;background:var(--blue);height:10px;transition:height .15s}
.var-card .vi i:nth-child(even){background:var(--lime)}
.var-card b{display:block;font:600 15px var(--fb)}
.var-card small{display:block;margin-top:3px;font:400 12.5px var(--fb);color:var(--muted)}
.var-card svg{margin-left:auto;width:20px;height:20px;color:var(--muted)}

.sheet-bg{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:81;padding:8px 8px 22px;border-radius:30px;background:#15171E;border:1px solid var(--line-2);transform:translateY(110%);transition:transform .45s var(--ease)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:4px auto 10px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 14px;border-radius:14px;font:500 15px var(--fb);text-align:left}
.sheet button:hover{background:rgba(255,255,255,.05)}
.sheet button svg{width:20px;height:20px;color:var(--muted)}
.sheet button small{margin-left:auto;font-size:12px;color:var(--muted)}
.sheet .danger{color:#FF6B6B}.sheet .danger svg{color:#FF6B6B}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
</style>
</head>

<script>
/* ───────── Shared helpers ───────── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=sessionStorage.getItem('riitm:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{sessionStorage.setItem('riitm:'+k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
function go(url){document.body.classList.add('leaving');Player.stop();setTimeout(()=>{location.href=url},400)}
addEventListener('pageshow',e=>{if(e.persisted)document.body.classList.remove('leaving')});
let toastT;function toast(msg){const t=$('#toast');$('span',t).textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function fit(){const w=$('#wrap'),d=$('#device');
  if(matchMedia('(max-width:520px)').matches){w.style.width=w.style.height='';d.style.removeProperty('--scale');return}
  const s=Math.min(1,(innerHeight-96)/864,(innerWidth-32)/410);d.style.setProperty('--scale',s);w.style.width=410*s+'px';w.style.height=864*s+'px'}
addEventListener('resize',fit);fit();
function makeWaves(svg,w,h,bg,layers){
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  let out=bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:'';
  for(const L of layers){const P=L.period||w,step=P/48;let d=`M0 ${h+10}`;
    for(let x=0;x<=w+P+0.1;x+=step){const y=L.y+L.amp*Math.sin(2*Math.PI*x/P+(L.ph||0))+(L.amp2||0)*Math.sin(4*Math.PI*x/P+(L.ph||0)*1.7);d+=`L${x.toFixed(1)} ${y.toFixed(1)}`}
    out+=`<path d="${d}L${(w+P).toFixed(1)} ${h+10}Z" fill="${L.c}" style="--p:${-P}px;animation:waveSlide ${L.dur||10}s linear infinite${L.rev?' reverse':''}"/>`}
  svg.innerHTML=out}
// Brand wave (from the user's references): a mirrored sound wave, a white core inside blue, ink, lime and blue bands,
// whose peaks travel along it. Draws the desktop backdrop here and the home banner.
// o.amp: peak half-height as a share of the canvas height · o.base: band thickness scale · o.core: white core half-width (px)
// o.level(): 0…1 swell target (e.g. playing vs paused) · o.glow: paint the blue/lime glow inside the canvas
function brandWave(cv,o){
  o=Object.assign({amp:.4,base:1,core:1.4,speed:1,level:()=>1,glow:false,maxDpr:3},o);
  const ctx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W=0,H=0,dpr=1,t=0,last=0,level=o.level();
  const LAYERS=[['#0062FF',1,3.4],['#9DFF00',.74,2.6],['#000B1C',.52,1.9],['#0062FF',.36,1.5]];  // colour, share of peak height, base half-width
  // 0…1 amplitude along the wave: travelling bumps of different widths, so peaks rise and fall as they move
  const env=(u,ph)=>Math.min(1,(.07+.5*Math.pow(Math.sin(u*Math.PI*3.2+t*.9+ph)*.5+.5,4)
    +.75*Math.pow(Math.sin(u*Math.PI*1.6-t*.55+ph*1.9)*.5+.5,8)+.18*Math.pow(Math.sin(u*Math.PI*9.5+t*2.2+ph)*.5+.5,2))/1.15);
  function size(){const r=cv.getBoundingClientRect(),k=r.width/cv.offsetWidth||1;dpr=Math.min(o.maxDpr,Math.max(1,k)*(devicePixelRatio||1));
    W=cv.offsetWidth;H=cv.offsetHeight;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));draw()}
  function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const c=H/2,A=H*o.amp*level,step=Math.max(3,W/480),n=Math.ceil(W/step),top=[],bot=[];
    for(let i=0;i<=n;i++){const u=i*step/W,e=env(u,0);top.push(e);bot.push(.55*e+.45*env(u,2.3))}
    LAYERS.forEach(([col,share,base],li)=>{
      ctx.shadowBlur=o.glow&&li<2?H*(li?.05:.08):0;ctx.shadowColor=li?'rgba(157,255,0,.35)':'rgba(0,98,255,.8)';
      ctx.beginPath();base*=o.base;
      for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-base-A*share*top[i]);
      for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+base+A*share*bot[i]);
      ctx.closePath();ctx.fillStyle=col;ctx.fill()});
    ctx.shadowBlur=0;ctx.beginPath();
    for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6)));
    for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6+1)));
    ctx.closePath();ctx.fillStyle='#FFFFFF';ctx.fill()}
  function frame(now){const dt=last?Math.max(0,Math.min(.1,(now-last)/1000)):0;last=now;
    if(cv.offsetWidth){level+=(o.level()-level)*Math.min(1,dt*3);t+=dt*o.speed*(.25+.75*level);draw()}   // hidden (phones): idle
    requestAnimationFrame(frame)}
  if(window.ResizeObserver)new ResizeObserver(size).observe(cv);size();
  if(!still)requestAnimationFrame(frame)}
brandWave($('#bgWave'),{amp:.3,base:6,core:7,speed:.5,glow:true,maxDpr:1.5});
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#restartBtn').onclick=()=>{try{sessionStorage.clear()}catch(e){}go('index.html')};
(function clock(){const c=$('#clock');if(!c)return;const tick=()=>{const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,15000)})();

/* ───────── Page 3 ───────── */
const BPM=112;
const mood=store.get('mood','Chill'),genre=store.get('genre','EDM'),durLabel=store.get('duration','1 min');
const isVar=params.get('variation')==='1',varN=store.get('variation',0);
const DUR={'30 sec':34,'1 min':68,'2 min':138,'3+ min':206}[durLabel]||68;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
$('#tags').innerHTML=[genre,mood,'Electronic'].filter((v,i,a)=>a.indexOf(v)===i).join('<i>•</i>');
$('#tot').textContent=fmt(DUR);
$('#details').textContent=`A minor · ${BPM} BPM · ${fmt(DUR)}`;

/* Seeded random */

const cuts=$('#cuts',art),hl=$('#hl',art),ripples=$('#ripples',art),halo=$('#halo',art),sat=$('#sat',art),refl=$('#refl',art);
const CUTN=9,HLN=12;
for(let i=0;i<CUTN;i++)cuts.insertAdjacentHTML('beforeend','<rect x="90" width="220"/>');

const cutEls=[...cuts.children],hlEls=[...hl.children],ripEls=[...ripples.children];
function drawArt(pos,level){
  const ph=(pos*BPM/60/4)%1;                       // one cycle per bar
  cutEls.forEach((r,i)=>{const k=i+ph,y=176+k*11.5,h=.6+k*1.05;r.setAttribute('y',y.toFixed(2));r.setAttribute('height',Math.max(0,h).toFixed(2))});
  const gp=(pos*.45)%1;
  hlEls.forEach((l,i)=>{const z=(i+gp)/HLN,y=262+138*Math.pow(z,2.1);l.setAttribute('y1',y.toFixed(2));l.setAttribute('y2',y.toFixed(2));l.setAttribute('opacity',(.25+z*.75).toFixed(2))});
  const beat=(pos*BPM/60)%1;
  ripEls.forEach((c,i)=>{const f=((pos*BPM/60/2)+i/4)%1;c.setAttribute('r',(98+f*150).toFixed(1));c.setAttribute('stroke-opacity',((1-f)*.55).toFixed(3))});
  const pulse=level!=null?level:Math.pow(1-beat,3);
  halo.setAttribute('opacity',(.22+pulse*.35).toFixed(3));halo.setAttribute('r',(106+pulse*14).toFixed(1));
  refl.setAttribute('opacity',(.2+pulse*.25).toFixed(3));
  const a=pos*.9;sat.setAttribute('cx',(200+152*Math.cos(a)).toFixed(1));sat.setAttribute('cy',(170+30*Math.sin(a)).toFixed(1));
  sat.setAttribute('opacity',Math.sin(a)<0&&Math.abs(152*Math.cos(a))<92?.15:1);

/* ── Waveform ── */
const wv=$('#waveCv'),wctx=wv.getContext('2d'),waveBox=$('#wave');
const BARS=66,R2=rng(isVar?99+varN:7),heights=[];
for(let i=0;i<BARS;i++){const x=i/(BARS-1);
  const env=Math.min(1,.28+x*2.4)*(x>.56&&x<.66?.45:1)*(x>.9?1-(x-.9)*6:1);
  heights.push(Math.max(.12,env*(.35+.65*R2())))}
let WD=Math.min(2,devicePixelRatio||1),hoverX=-1;
function sizeWave(){const k=(waveBox.getBoundingClientRect().width/waveBox.offsetWidth)||1;wv.width=Math.round(waveBox.offsetWidth*WD*Math.max(1,k));wv.height=Math.round(waveBox.offsetHeight*WD*Math.max(1,k))}
new ResizeObserver(sizeWave).observe(waveBox);sizeWave();
const css=getComputedStyle(document.body);
function drawWave(t,prog,playing,level){
  const W=wv.width,H=wv.height,u=W/346,gap=2.2*u,bw=(W-gap*(BARS-1))/BARS,acc=css.getPropertyValue('--accent').trim()||'#B6FF38';
  wctx.clearRect(0,0,W,H);
  const px=prog*W;
  for(let i=0;i<BARS;i++){
    const x=i*(bw+gap),cx=x+bw/2,d=Math.abs(cx-px)/W;
    let h=heights[i];
    if(playing){const near=Math.max(0,1-d*7);h*=1+near*(.35*Math.sin(t*14+i*1.7)+(level||0)*.5)}
    const bh=Math.max(2*u,Math.min(H,h*H*.95)),y=(H-bh)/2;
    const played=cx<=px;
    if(played){wctx.fillStyle=acc;wctx.globalAlpha=.55+.45*Math.max(0,1-d*5)}
    else{wctx.fillStyle='#fff';wctx.globalAlpha=hoverX>=0&&cx<=hoverX*W?.42:.2}
    const r=Math.min(bw/2,bh/2);wctx.beginPath();
    if(wctx.roundRect)wctx.roundRect(x,y,bw,bh,r);else wctx.rect(x,y,bw,bh);wctx.fill()}
  wctx.globalAlpha=1;
  // playhead
  wctx.fillStyle='#fff';wctx.shadowColor=acc;wctx.shadowBlur=10*u;wctx.fillRect(px-1*u,0,2*u,H);wctx.shadowBlur=0}

  init(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;

    this.an=c.createAnalyser();this.an.fftSize=256;this.bins=new Uint8Array(this.an.frequencyBinCount);
    this.master.connect(comp);comp.connect(this.an);this.an.connect(c.destination);
    const dl=c.createDelay(1);dl.delayTime.value=60/BPM*.75;const fb=c.createGain();fb.gain.value=.36;const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2400;
    const wet=c.createGain();wet.gain.value=.3;dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(wet);wet.connect(this.master);this.dl=dl;
    const len=c.sampleRate*2.6,ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

    const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;this.noise=nb;

  mtof:m=>440*Math.pow(2,(m-69)/12),
  CH:[{n:[57,60,64,67,71],b:45},{n:[53,57,60,64,69],b:41},{n:[55,60,64,67,71],b:48},{n:[55,59,62,64,67],b:43}],
  tick(){const c=this.ctx;if(!c||c.state!=='running')return;const s16=60/BPM/4;

  play(step,t){const s=step%16,ch=this.CH[step>>4],x=Player.pos/Player.dur;
    const intro=x<.1,brk=x>.56&&x<.66,outro=x>.92;

    if(!brk&&s%4===2)this.hat(t,.16,true);
    if(!intro&&s%2===1)this.hat(t,.05,false);
    if(s===0)this.pad(t,ch.n,16*60/BPM/4,brk?1.5:1);
    if(!intro&&!brk&&(s===0||s===7||s===10))this.bass(t,ch.b+(s===10?12:0),s===0?.38:.18);

  clap(t){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='bandpass';f.frequency.value=1700;f.Q.value=.9;

/* ── Player state ── */
const playBtn=$('#playBtn'),ringArc=$('#ringArc'),cur=$('#cur'),unmute=$('#unmute'),varBars=$$('#varEq i');
const Player={pos:0,dur:DUR,playing:true,repeat:false,shuffle:false,audio:false,
  async setPlaying(p){this.playing=p;playBtn.classList.toggle('paused',!p);
    if(p){if(this.audio){Synth.on()}}else Synth.off()},
  async enableAudio(){if(this.audio)return;const ok=await Synth.on();if(ok){this.audio=true;unmute.classList.add('hide');if(!this.playing)Synth.off()}},
  stop(){this.playing=false;Synth.off()}};

let lastT=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.1,(now-lastT)/1000));lastT=now;
  if(Player.playing&&!seeking){Player.pos+=dt;
    if(Player.pos>=Player.dur){if(Player.repeat)Player.pos=0;else{Player.pos=0;Player.setPlaying(false);toast('Track finished — tap play to listen again')}}}
  const prog=Player.pos/Player.dur,lvl=Player.playing&&Player.audio?Synth.level():null;
  drawWave(now/1000,prog,Player.playing,lvl||0);
  if(Player.playing)drawArt(Player.pos,lvl);
  ringArc.style.strokeDashoffset=(235.6*(1-prog)).toFixed(2);
  cur.textContent=fmt(Player.pos);
  const beat=Player.playing?Math.pow(1-((Player.pos*BPM/60)%1),2):0;
  varBars.forEach((b,i)=>b.style.height=(Player.playing?6+Math.abs(Math.sin(now/180+i*1.3))*14*(.5+beat*.5):4+i%3*3)+'px');
  requestAnimationFrame(loop)}
drawArt(0,null);requestAnimationFrame(loop);

/* Try audio right away (works when the browser already allows it), otherwise invite a tap */
setTimeout(async()=>{await Player.enableAudio();if(!Player.audio&&Player.playing)unmute.classList.remove('hide')},900);
$('#app').addEventListener('pointerdown',e=>{if(!e.isTrusted)return;if(!Player.audio)Player.enableAudio()},{capture:true});
unmute.onclick=()=>{Player.enableAudio();if(!Player.playing)Player.setPlaying(true)};

/* Controls */
playBtn.onclick=()=>Player.setPlaying(!Player.playing);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('button,[tabindex]')){e.preventDefault();Player.enableAudio();Player.setPlaying(!Player.playing)}});
$('#prevBtn').onclick=()=>{if(Player.pos>3){Player.pos=0}else{Player.pos=0;toast('This is the first track in your session')}};
$('#nextBtn').onclick=()=>toast('End of queue — create a variation to keep going');
$('#shuffleBtn').onclick=e=>{Player.shuffle=!Player.shuffle;e.currentTarget.classList.toggle('on',Player.shuffle);toast(Player.shuffle?'Shuffle on':'Shuffle off')};
$('#repeatBtn').onclick=e=>{Player.repeat=!Player.repeat;e.currentTarget.classList.toggle('on',Player.repeat);toast(Player.repeat?'Repeat track on':'Repeat off')};

/* Seek */
let seeking=false;
function seekTo(e){const r=waveBox.getBoundingClientRect();Player.pos=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*Player.dur;drawArt(Player.pos,null)}
waveBox.addEventListener('pointerdown',e=>{seeking=true;waveBox.setPointerCapture(e.pointerId);seekTo(e)});
waveBox.addEventListener('pointermove',e=>{const r=waveBox.getBoundingClientRect();hoverX=(e.clientX-r.left)/r.width;if(seeking)seekTo(e)});
waveBox.addEventListener('pointerup',()=>{seeking=false});
waveBox.addEventListener('pointercancel',()=>{seeking=false});
waveBox.addEventListener('pointerleave',()=>{hoverX=-1});
waveBox.addEventListener('keydown',e=>{if(e.key==='ArrowRight')Player.pos=Math.min(Player.dur,Player.pos+5);if(e.key==='ArrowLeft')Player.pos=Math.max(0,Player.pos-5)});

function burst(btn){const c=$('.c',btn);for(let i=0;i<10;i++){const a=i/10*Math.PI*2,s=document.createElement('span');s.className='burst';
  s.style.setProperty('--x',Math.cos(a)*38+'px');s.style.setProperty('--y',Math.sin(a)*38+'px');c.appendChild(s);setTimeout(()=>s.remove(),650)}}
const likeBtn=$('#likeBtn');
likeBtn.onclick=()=>{const on=!likeBtn.classList.contains('on');likeBtn.classList.toggle('on',on);$('#likeLbl').textContent=on?'Liked':'Like';
  likeBtn.classList.remove('pop');void likeBtn.offsetWidth;likeBtn.classList.add('pop');if(on){burst(likeBtn);toast('Added to Liked songs')}};
const dlBtn=$('#dlBtn');let dlState=0;

  dlState=1;dlBtn.classList.add('loading');const arc=$('#dlArc'),t0=performance.now();
  (function step(now){const p=Math.min(1,(now-t0)/1600);arc.style.strokeDashoffset=163.4*(1-p);
    if(p<1)requestAnimationFrame(step);else{dlState=2;dlBtn.classList.remove('loading');dlBtn.classList.add('on');
      $('#dlIco').innerHTML='<path d="M5 12.5l4.5 4.5L19 7.5"/>';toast('“Midnight Freedom” saved · WAV 24-bit')}})(t0)};
$('#shareBtn').onclick=async()=>{const data={title:'Midnight Freedom — made with Riitm AI',text:'Listen to the track I just generated with Riitm',url:location.href};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(location.href);toast('Link copied to clipboard')}catch(e){toast('Share link ready: riitm.app/t/midnight-freedom')}};
$('#remixBtn').onclick=()=>go('index.html?remix=1');
$('#varBtn').onclick=()=>{store.set('variation',Math.max(1,varN)+(isVar?1:0));go('generating.html?variation=1')};
$('#backBtn').onclick=()=>go('index.html?demo=0');

/* More sheet */
const app=$('#app');
$('#moreBtn').onclick=()=>app.classList.add('open');
$('#sheetBg').onclick=()=>app.classList.remove('open');
$$('#sheet button').forEach(b=>b.onclick=()=>{app.classList.remove('open');setTimeout(()=>toast(b.dataset.msg==='details'?`${genre} · ${mood} · ${$('#details').textContent}`:b.dataset.msg),250)});
</script>
</body>
