<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riitm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Riitm — Create</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Shared tokens & device frame ───────── */
:root{
  --bg:#0B0C10; --card:#14161D; --card-2:#1A1D26; --field:#0F1116;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F4F6F8; --muted:#8C93A1; --dim:#5D6370;
  --lime:#B6FF38; --lime-brand:#9DFF00; --blue:#0062FF; --ink:#000B1C;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Archivo','Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0B0C10}
body{height:100vh;height:100dvh;overflow:hidden;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.stage-bg canvas{display:block;width:100%;height:100%}
.stage-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 48%,rgba(11,12,16,.6),rgba(11,12,16,0) 75%)}
.device-wrap{position:relative;z-index:1;width:410px;height:864px;flex:none}
.device{position:absolute;left:0;top:0;width:410px;height:864px;padding:10px;border-radius:60px;
  background:linear-gradient(150deg,#3b3e47,#121318 28%,#0a0b0e 70%,#2b2e36);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 50px 120px -30px rgba(0,0,0,.9),0 0 0 1px #000;
  transform:scale(var(--scale,1));transform-origin:0 0}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);isolation:isolate}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;padding:17px 30px 0 38px;display:flex;justify-content:space-between;font:600 15px var(--fb);letter-spacing:-.01em}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:60;pointer-events:none}
.hdr{flex:none;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{display:block;height:26px}
.logo svg{height:26px;width:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(255,255,255,.03);transition:background .2s,transform .2s var(--ease)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(11,12,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.toolbar a,.toolbar button{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--fb);color:var(--muted);text-decoration:none;transition:color .2s,background .2s;white-space:nowrap}
.toolbar a:hover,.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.toolbar a.on{background:var(--lime);color:#0B0C10}
.toolbar .n{font-variant-numeric:tabular-nums;opacity:.55}
.toolbar .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.toolbar svg{width:15px;height:15px}
.toast{position:absolute;left:50%;bottom:112px;z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:86%;
  padding:11px 16px;border-radius:16px;background:rgba(26,29,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);font:500 13px var(--fb);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transition:opacity .3s,transform .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);flex:none}
.reveal{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0) * 75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
body.leaving .app{animation:leave .42s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes waveSlide{to{transform:translateX(var(--p))}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .stage{display:block}
  .stage-bg,.toolbar,.statusbar,.homebar{display:none}
  .device-wrap{width:100%!important;height:100%!important}
  .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{border-radius:0}
  .app{padding-top:max(env(safe-area-inset-top),8px);padding-bottom:env(safe-area-inset-bottom)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ───────── Page 1: Prompt ───────── */

.hero{position:relative;padding:10px 22px 0;min-height:184px}
.hero h1{position:relative;z-index:2;font:800 33px/1.02 var(--fd);font-stretch:112%;letter-spacing:-.015em;text-shadow:0 2px 24px rgba(11,12,16,.8)}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p{position:relative;z-index:2;margin-top:12px;font:400 15px var(--fb);color:#C3C8D1}
.hero-art{position:absolute;right:-30px;top:-10px;width:158px;height:184px;z-index:1;--r:8deg}
.hero-art .tile{position:absolute;inset:0;border-radius:44px;overflow:hidden;transform:rotate(var(--r));
  box-shadow:0 30px 60px -20px rgba(0,98,255,.55),0 0 0 1px rgba(255,255,255,.08);animation:floaty 6s ease-in-out infinite}
.hero-art .tile svg{width:100%;height:100%}
.hero-art .glow{position:absolute;inset:16% 4% 10% 10%;border-radius:50%;background:radial-gradient(circle,rgba(182,255,56,.35),transparent 70%);filter:blur(24px)}
@keyframes floaty{50%{transform:rotate(calc(var(--r) - 3deg)) translateY(-6px)}}

.card{margin:12px 14px 0;padding:16px 16px 18px;border-radius:26px;background:linear-gradient(180deg,#161922,#12141A);border:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(0,0,0,.8)}
.field-head{display:flex;justify-content:space-between;align-items:center;font:500 12.5px var(--fb);color:#C3C8D1}
.field-head span{color:var(--dim);font-variant-numeric:tabular-nums;transition:color .2s}
.field{position:relative;margin-top:10px;border-radius:16px;background:var(--field);border:1px solid var(--line-2);transition:border-color .25s,box-shadow .25s}
.field:focus-within,.field.typing{border-color:rgba(182,255,56,.55);box-shadow:0 0 0 4px rgba(182,255,56,.08)}
.field textarea,.field .mirror{display:block;width:100%;min-height:68px;padding:12px 40px 12px 14px;font:400 14.5px/1.45 var(--fb);color:var(--text);white-space:pre-wrap;word-wrap:break-word}
.field textarea{background:transparent;border:0;outline:0;resize:none;height:68px}
.field textarea::placeholder{color:var(--dim)}
.field .mirror{position:absolute;inset:0;pointer-events:none;display:none}
.field.typing textarea{color:transparent}
.field.typing .mirror{display:block}
.caret{display:inline-block;width:2px;height:1.1em;margin-left:1px;vertical-align:-3px;background:var(--lime);border-radius:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.field.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.clear{position:absolute;right:8px;top:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:opacity .2s,background .2s}
.clear:hover{background:rgba(255,255,255,.06)}
.clear svg{width:15px;height:15px}
.clear.hide{opacity:0;pointer-events:none}
.group{margin-top:13px}
.group h3{font:500 13px var(--fb);color:#C3C8D1;margin-bottom:9px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips:not(.grid4){-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.chips.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font:500 12.5px var(--fb);color:#CDD2DA;background:rgba(255,255,255,.015);
  transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease),box-shadow .3s}
.chip:hover{border-color:rgba(255,255,255,.28)}
.chip:active,.chip.tap{transform:scale(.92)}
.chips[data-style=lime] .chip.on{background:var(--lime);border-color:var(--lime);color:#0B0C10;font-weight:600;box-shadow:0 6px 18px -6px rgba(182,255,56,.6)}
.chips[data-style=blue] .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;box-shadow:0 6px 18px -6px rgba(0,98,255,.8)}

.gen-btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 28px);height:60px;margin:14px 14px 14px;border-radius:999px;
  background:var(--lime);color:#0B0C10;font:600 18px var(--fb);letter-spacing:-.01em;
  box-shadow:0 14px 40px -12px rgba(182,255,56,.65),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .25s var(--ease),box-shadow .3s}
.gen-btn svg{width:22px;height:22px;fill:#0B0C10}
.gen-btn::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 3.6s ease-in-out infinite 1.5s}
@keyframes sheen{0%{left:-80px}35%,100%{left:110%}}
.gen-btn:hover{box-shadow:0 18px 50px -10px rgba(182,255,56,.8)}
.gen-btn:active,.gen-btn.press{transform:scale(.96)}
.gen-btn .spark{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.82) rotate(12deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(11,12,16,.22);transform:scale(0);animation:ripple .7s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.gen-btn.go{box-shadow:0 0 0 10px rgba(182,255,56,.12),0 0 60px 4px rgba(182,255,56,.5)}

.tabbar{flex:none;display:flex;justify-content:space-around;padding:8px 12px 24px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(14,15,20,.9),#0B0C10)}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;font:500 11.5px var(--fb);color:var(--muted);transition:color .2s}
.tab .ti{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--text)}
.tab.on .ti{color:var(--lime);background:radial-gradient(circle,rgba(182,255,56,.18),rgba(182,255,56,.04) 70%);box-shadow:0 0 22px rgba(182,255,56,.25)}
.tab:not(.on):hover{color:var(--text)}
@media (max-width:520px){.tabbar{padding-bottom:max(12px,env(safe-area-inset-bottom))}}

/* ───────── Mobile: tap-to-start splash + fullscreen shell ───────── */
.splash{display:none}
@media (max-width:520px){
  .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 120px;text-align:center;
    background:var(--bg);overflow:hidden;cursor:pointer;transition:opacity .5s,transform .6s var(--ease)}
  .splash[hidden]{display:none}
}
.splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.splash .s-logo svg{height:30px;width:auto}
.splash h2{margin-top:34px;font:800 34px/1.04 var(--fd);font-stretch:112%;letter-spacing:-.015em}
.splash h2 em{font-style:normal;color:var(--lime)}
.splash p{margin-top:12px;font:400 15px var(--fb);color:#AEB4BF}
.splash .s-btn{margin-top:34px;display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 30px;border-radius:999px;background:var(--lime);color:#0B0C10;font:600 17px var(--fb);
  box-shadow:0 14px 40px -12px rgba(182,255,56,.7);animation:breathe 2.2s ease-in-out infinite}
.splash .s-btn svg{width:18px;height:18px;fill:#0B0C10}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(182,255,56,.08),0 14px 40px -12px rgba(182,255,56,.9)}}
.splash small{margin-top:16px;font:500 12px var(--fb);color:var(--dim);max-width:260px;line-height:1.5}
.splash .s-waves{position:absolute;left:0;right:0;bottom:0;height:150px}
.splash .s-waves svg{width:100%;height:100%}
.shell{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:90;background:#0B0C10}
</style>
</head>

<script>
/* ───────── Shared helpers ───────── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=sessionStorage.getItem('riitm:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{sessionStorage.setItem('riitm:'+k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
function go(url){document.body.classList.add('leaving');setTimeout(()=>{location.href=url},400)}
addEventListener('pageshow',e=>{if(e.persisted)document.body.classList.remove('leaving')});
let toastT;function toast(msg){const t=$('#toast');$('span',t).textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function fit(){const w=$('#wrap'),d=$('#device');
  if(matchMedia('(max-width:520px)').matches){w.style.width=w.style.height='';d.style.removeProperty('--scale');return}
  const s=Math.min(1,(innerHeight-96)/864,(innerWidth-32)/410);d.style.setProperty('--scale',s);w.style.width=410*s+'px';w.style.height=864*s+'px'}
addEventListener('resize',fit);fit();
function makeWaves(svg,w,h,bg,layers){
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  let out=bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:'';
  for(const L of layers){const P=L.period||w,step=P/48;let d=`M0 ${h+10}`;
    for(let x=0;x<=w+P+0.1;x+=step){const y=L.y+L.amp*Math.sin(2*Math.PI*x/P+(L.ph||0))+(L.amp2||0)*Math.sin(4*Math.PI*x/P+(L.ph||0)*1.7);d+=`L${x.toFixed(1)} ${y.toFixed(1)}`}
    out+=`<path d="${d}L${(w+P).toFixed(1)} ${h+10}Z" fill="${L.c}" style="--p:${-P}px;animation:waveSlide ${L.dur||10}s linear infinite${L.rev?' reverse':''}"/>`}
  svg.innerHTML=out}
// Brand wave (from the user's references): a mirrored sound wave, a white core inside blue, ink, lime and blue bands,
// whose peaks travel along it. Draws the desktop backdrop here and the home banner.
// o.amp: peak half-height as a share of the canvas height · o.base: band thickness scale · o.core: white core half-width (px)
// o.level(): 0…1 swell target (e.g. playing vs paused) · o.glow: paint the blue/lime glow inside the canvas
function brandWave(cv,o){
  o=Object.assign({amp:.4,base:1,core:1.4,speed:1,level:()=>1,glow:false,maxDpr:3},o);
  const ctx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W=0,H=0,dpr=1,t=0,last=0,level=o.level();
  const LAYERS=[['#0062FF',1,3.4],['#9DFF00',.74,2.6],['#000B1C',.52,1.9],['#0062FF',.36,1.5]];  // colour, share of peak height, base half-width
  // 0…1 amplitude along the wave: travelling bumps of different widths, so peaks rise and fall as they move
  const env=(u,ph)=>Math.min(1,(.07+.5*Math.pow(Math.sin(u*Math.PI*3.2+t*.9+ph)*.5+.5,4)
    +.75*Math.pow(Math.sin(u*Math.PI*1.6-t*.55+ph*1.9)*.5+.5,8)+.18*Math.pow(Math.sin(u*Math.PI*9.5+t*2.2+ph)*.5+.5,2))/1.15);
  function size(){const r=cv.getBoundingClientRect(),k=r.width/cv.offsetWidth||1;dpr=Math.min(o.maxDpr,Math.max(1,k)*(devicePixelRatio||1));
    W=cv.offsetWidth;H=cv.offsetHeight;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));draw()}
  function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const c=H/2,A=H*o.amp*level,step=Math.max(3,W/480),n=Math.ceil(W/step),top=[],bot=[];
    for(let i=0;i<=n;i++){const u=i*step/W,e=env(u,0);top.push(e);bot.push(.55*e+.45*env(u,2.3))}
    LAYERS.forEach(([col,share,base],li)=>{
      ctx.shadowBlur=o.glow&&li<2?H*(li?.05:.08):0;ctx.shadowColor=li?'rgba(157,255,0,.35)':'rgba(0,98,255,.8)';
      ctx.beginPath();base*=o.base;
      for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-base-A*share*top[i]);
      for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+base+A*share*bot[i]);
      ctx.closePath();ctx.fillStyle=col;ctx.fill()});
    ctx.shadowBlur=0;ctx.beginPath();
    for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6)));
    for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6+1)));
    ctx.closePath();ctx.fillStyle='#FFFFFF';ctx.fill()}
  function frame(now){const dt=last?Math.max(0,Math.min(.1,(now-last)/1000)):0;last=now;
    if(cv.offsetWidth){level+=(o.level()-level)*Math.min(1,dt*3);t+=dt*o.speed*(.25+.75*level);draw()}   // hidden (phones): idle
    requestAnimationFrame(frame)}
  if(window.ResizeObserver)new ResizeObserver(size).observe(cv);size();
  if(!still)requestAnimationFrame(frame)}
brandWave($('#bgWave'),{amp:.3,base:6,core:7,speed:.5,glow:true,maxDpr:1.5});
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

  {y:94,amp:10,c:'#FFFFFF',dur:9},{y:112,amp:12,c:'#0062FF',dur:9,ph:.6},{y:128,amp:16,c:'#000B1C',dur:6.5,rev:1,ph:2.4},

const DEMO_TEXT='A chill electronic song about feeling free and enjoying the night';
const ta=$('#prompt'),field=$('#field'),mirror=$('#mirror'),count=$('#count'),clearBtn=$('#clearBtn'),genBtn=$('#genBtn');

function updateCount(){const n=ta.value.length;count.textContent=n+'/500';count.style.color=n?'#C3C8D1':'';clearBtn.classList.toggle('hide',!n)}
ta.addEventListener('input',updateCount);
clearBtn.onclick=()=>{ta.value='';updateCount();ta.focus()};

function select(group,label,animate){const box=$(`.chips[data-group="${group}"]`);
  $$('.chip',box).forEach(c=>c.classList.toggle('on',c.textContent===label));
  const on=$$('.chip',box).find(c=>c.textContent===label);
  if(on){if(box.scrollWidth>box.clientWidth)box.scrollTo({left:Math.max(0,on.offsetLeft-box.clientWidth/2+on.offsetWidth/2),behavior:animate?'smooth':'auto'});
    if(animate){on.classList.add('tap');setTimeout(()=>on.classList.remove('tap'),220)}}
  store.set(group,label)}
const selected=g=>($(`.chips[data-group="${g}"] .chip.on`)||{}).textContent||'';
$$('.chips').forEach(box=>box.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)select(box.dataset.group,c.textContent,true)}));

$$('.tab').forEach(t=>t.onclick=()=>{if(!t.classList.contains('on'))toast(`${t.dataset.tab} isn’t part of this prototype — try Create`)});
$('#profileBtn').onclick=()=>toast('Profile · Riitm Creator plan');

function ripple(btn,x,y){const r=btn.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,el=document.createElement('span');
  const k=r.width/btn.offsetWidth||1; // account for device scaling
  el.className='ripple';el.style.width=el.style.height=s/k+'px';
  el.style.left=((x-r.left)/k-s/k/2)+'px';el.style.top=((y-r.top)/k-s/k/2)+'px';btn.appendChild(el);setTimeout(()=>el.remove(),750)}

function generate(x,y){
  const text=ta.value.trim();
  if(!text){field.classList.remove('shake');void field.offsetWidth;field.classList.add('shake');toast('Describe your song first');return}
  const r=genBtn.getBoundingClientRect();ripple(genBtn,x??r.left+r.width/2,y??r.top+r.height/2);
  genBtn.classList.add('go');
  store.set('prompt',text);store.set('variation',0);
  const q=new URLSearchParams({mood:selected('mood')||'Chill',genre:selected('genre')||'EDM',dur:selected('duration')||'1 min'});
  setTimeout(()=>go('generating.html?'+q),320)}
genBtn.addEventListener('click',e=>{stopDemo();generate(e.clientX,e.clientY)});

/* Live demo sequence */
let demoOn=false,timers=[];
const wait=ms=>new Promise((res,rej)=>{const id=setTimeout(()=>demoOn?res():rej('stop'),ms);timers.push(id)});
function stopDemo(){if(!demoOn)return;demoOn=false;timers.forEach(clearTimeout);field.classList.remove('typing');genBtn.classList.remove('press');updateCount()}
async function runDemo(){
  demoOn=true;
  select('mood','Happy');select('genre','Pop');select('duration','30 sec');
  ta.value='';updateCount();field.classList.add('typing');mirror.innerHTML='<span class="caret"></span>';
  try{
    await wait(1100);
    for(let i=1;i<=DEMO_TEXT.length;i++){
      ta.value=DEMO_TEXT.slice(0,i);updateCount();
      mirror.textContent=ta.value;mirror.insertAdjacentHTML('beforeend','<span class="caret"></span>');
      const ch=DEMO_TEXT[i-1];await wait(ch===' '?70+Math.random()*90:28+Math.random()*48);
    }
    await wait(450);field.classList.remove('typing');
    await wait(350);select('mood','Chill',true);
    await wait(520);select('genre','EDM',true);
    await wait(520);select('duration','1 min',true);
    await wait(700);genBtn.classList.add('press');
    await wait(180);genBtn.classList.remove('press');
    demoOn=false;generate();
  }catch(e){}
}
// Any real user interaction hands control back to them
['pointerdown','keydown','wheel'].forEach(ev=>$('#app').addEventListener(ev,e=>{if(e.isTrusted&&demoOn&&!e.target.closest('#genBtn'))stopDemo()},{capture:true,passive:true}));

/* Initial state */
const isRemix=params.get('remix')==='1';
if(isRemix||params.get('demo')==='0'){
  ta.value=store.get('prompt',DEMO_TEXT);
  select('mood',store.get('mood','Chill'));select('genre',store.get('genre','EDM'));select('duration',store.get('duration','1 min'));
  updateCount();
  if(isRemix){ta.value=ta.value.replace(/\s*—\s*remix.*$/i,'')+' — remix with a deeper bassline and a faster tempo';updateCount();setTimeout(()=>toast('Remixing “Midnight Freedom” — tweak and generate'),700)}
}else if(matchMedia('(max-width:520px)').matches&&window.self===window.top&&
  !(matchMedia('(display-mode: fullscreen),(display-mode: standalone)').matches||navigator.standalone===true)){
  showSplash();
}else{runDemo()}

/* On phones the first tap enters fullscreen. The flow then runs inside a full-screen frame,
   so moving between the three pages doesn't drop out of fullscreen. */
function showSplash(){
  const splash=$('#splash');splash.hidden=false;
  $('#splashLogo').innerHTML=$('.logo').innerHTML;
  makeWaves($('#splashWaves'),390,150,null,[
    {y:56,amp:14,amp2:6,c:'#9DFF00',period:390,dur:9,ph:.3},{y:72,amp:16,amp2:5,c:'#0062FF',period:390,dur:12,rev:1,ph:1.6},
    {y:96,amp:14,amp2:6,c:'#000B1C',period:390,dur:8,ph:2.6},{y:104,amp:14,amp2:6,c:'#0B0C10',period:390,dur:8,ph:2.6}]);
  const el=document.documentElement,request=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!request)$('#splashHint').textContent='Tip: Share → Add to Home Screen to run it full screen';
  splash.addEventListener('click',async()=>{
    let full=false;
    if(request){try{await Promise.race([request.call(el,{navigationUI:'hide'}),new Promise(r=>setTimeout(r,800))])}catch(e){}full=!!(document.fullscreenElement||document.webkitFullscreenElement)}
    try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
    if(full){
      const f=document.createElement('iframe');f.className='shell';f.allow='autoplay; fullscreen';f.title='Riitm';
      f.src='index.html?embed=1';
      f.onload=()=>{splash.classList.add('gone');const st=$('.stage');if(st)st.style.display='none';setTimeout(()=>splash.remove(),600)};
      document.body.appendChild(f);
    }else{splash.classList.add('gone');setTimeout(()=>splash.remove(),600);runDemo()}
  },{once:true});
}
</script>
