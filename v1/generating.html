<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Riitm — Creating your track</title>

<style>
/* ───────── Shared tokens & device frame ───────── */
:root{
  --bg:#0B0C10; --card:#14161D; --card-2:#1A1D26; --field:#0F1116;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F4F6F8; --muted:#8C93A1; --dim:#5D6370;
  --lime:#B6FF38; --lime-brand:#9DFF00; --blue:#0062FF; --ink:#000B1C;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Archivo','Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0B0C10}
body{height:100vh;height:100dvh;overflow:hidden;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.stage-bg canvas{display:block;width:100%;height:100%}
.stage-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 48%,rgba(11,12,16,.6),rgba(11,12,16,0) 75%)}
.device-wrap{position:relative;z-index:1;width:410px;height:864px;flex:none}
.device{position:absolute;left:0;top:0;width:410px;height:864px;padding:10px;border-radius:60px;
  background:linear-gradient(150deg,#3b3e47,#121318 28%,#0a0b0e 70%,#2b2e36);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 50px 120px -30px rgba(0,0,0,.9),0 0 0 1px #000;
  transform:scale(var(--scale,1));transform-origin:0 0}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);isolation:isolate}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;padding:17px 30px 0 38px;display:flex;justify-content:space-between;font:600 15px var(--fb);letter-spacing:-.01em;position:relative;z-index:5}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:60;pointer-events:none}
.hdr{flex:none;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{display:block;height:26px}
.logo svg{height:26px;width:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(255,255,255,.03);transition:background .2s,transform .2s var(--ease)}
.icon-btn:hover{background:rgba(255,255,255,.07)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(11,12,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.toolbar a,.toolbar button{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--fb);color:var(--muted);text-decoration:none;transition:color .2s,background .2s;white-space:nowrap}
.toolbar a:hover,.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.toolbar a.on{background:var(--lime);color:#0B0C10}
.toolbar .n{font-variant-numeric:tabular-nums;opacity:.55}
.toolbar .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.toolbar svg{width:15px;height:15px}
.toast{position:absolute;left:50%;bottom:112px;z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:86%;
  padding:11px 16px;border-radius:16px;background:rgba(26,29,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);font:500 13px var(--fb);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transition:opacity .3s,transform .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);flex:none}
.reveal{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0) * 75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
body.leaving .app{animation:leave .42s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes waveSlide{to{transform:translateX(var(--p))}}
@media (max-width:520px){
  .stage{display:block}
  .stage-bg,.toolbar,.statusbar,.homebar{display:none}
  .device-wrap{width:100%!important;height:100%!important}
  .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{border-radius:0}
  .app{padding-top:max(env(safe-area-inset-top),8px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ───────── Page 2: Generating ───────── */
.app::before{content:"";position:absolute;left:50%;top:38%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(0,98,255,.22),rgba(0,98,255,.06) 45%,transparent 70%);pointer-events:none;z-index:0}
.intro{position:relative;z-index:2;flex:none;text-align:center;padding:14px 28px 0}
.intro h1{font:800 31px/1.06 var(--fd);font-stretch:108%;letter-spacing:-.015em;min-height:66px}
.intro h1 .dots i{font-style:normal;animation:dot 1.4s infinite both}
.intro h1 .dots i:nth-child(2){animation-delay:.2s}.intro h1 .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.15}40%{opacity:1}}
.intro p{margin:10px auto 0;max-width:290px;font:400 14.5px/1.45 var(--fb);color:#AEB4BF}
.intro h1.done{color:var(--lime)}

.viz{position:relative;z-index:1;flex:1;min-height:200px;display:grid;place-items:center}
.viz canvas{display:block}
.pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.pct b{font:700 44px/1 var(--fd);font-stretch:100%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pct b i{font-style:normal}
.pct b small{font-size:.5em;font-weight:600;margin-left:2px;vertical-align:.7em;color:var(--lime)}
.pct span{display:block;margin-top:6px;font:600 10px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:opacity .3s}
.pct.pop b{animation:pop .6s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}

.meta{position:relative;z-index:3;flex:none;display:flex;justify-content:center;gap:6px;flex-wrap:nowrap;padding:0 16px 30px}
.tag{height:26px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--fb);color:#CDD2DA;
  background:rgba(255,255,255,.05);border:1px solid var(--line);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .45s,transform .5s var(--ease)}
.tag.in{opacity:1;transform:none}
.tag em{font-style:normal;color:var(--lime)}

.bottom{position:relative;flex:none;z-index:2}
.bottom .waves{position:absolute;left:0;right:0;top:-74px;height:150px}
.bottom .waves svg{width:100%;height:100%}
.steps{position:relative;margin:0 14px 30px;padding:10px 18px 12px;border-radius:26px;background:linear-gradient(180deg,#171A23,#12141A);border:1px solid var(--line);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin:6px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--lime));box-shadow:0 0 12px rgba(182,255,56,.6)}
.step{display:flex;align-items:center;gap:14px;height:44px;font:500 14.5px var(--fb);color:var(--dim);transition:color .35s}
.step .st{position:relative;width:22px;height:22px;flex:none;border-radius:50%;border:1.6px solid rgba(255,255,255,.2);transition:border-color .3s,background .3s,box-shadow .3s}
.step .st svg{position:absolute;inset:3px;width:13px;height:13px;stroke:#0B0C10;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .1s var(--ease)}
.step .st::after{content:"";position:absolute;inset:-3.6px;border-radius:50%;border:2.4px solid transparent;opacity:0}
.step small{margin-left:auto;font:500 11.5px var(--fb);color:var(--muted);opacity:0;transform:translateX(6px);transition:opacity .3s,transform .4s var(--ease);white-space:nowrap}
.step.active{color:var(--text)}
.step.active .st{border-color:rgba(182,255,56,.25)}
.step.active .st::after{opacity:1;border-top-color:var(--lime);border-right-color:var(--lime);animation:spin .8s linear infinite;box-shadow:0 0 12px rgba(182,255,56,.35)}
.step.active small,.step.done small{opacity:1;transform:none}
.step.done{color:#C9CED6}
.step.done .st{background:var(--lime);border-color:var(--lime);box-shadow:0 0 14px rgba(182,255,56,.45)}
.step.done .st svg{stroke-dashoffset:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:520px){.steps{margin-bottom:max(16px,env(safe-area-inset-bottom))}}
</style>
</head>

      <section class="intro reveal" style="--d:1">
        <h1 id="title">Creating<br>your track<span class="dots"><i>.</i><i>.</i><i>.</i></span></h1>
        <p id="sub">Our AI is composing a unique song based on your ideas</p>

      <section class="viz reveal" style="--d:2" id="viz">

        <div class="pct" id="pctBox"><b><i id="pct">0</i><small>%</small></b><span id="pctLabel">Analyzing</span></div>

      <div class="meta" id="meta"></div>

      <section class="bottom reveal" style="--d:3">
        <div class="waves" aria-hidden="true"><svg id="bandWaves"></svg></div>
        <div class="steps">
          <div class="bar"><i id="bar"></i></div>
          <div class="step" data-at="22"><span class="st"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.4"/></svg></span>Analyzing your prompt<small></small></div>
          <div class="step" data-at="55"><span class="st"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.4"/></svg></span>Composing melody<small></small></div>
          <div class="step" data-at="85"><span class="st"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.4"/></svg></span>Adding instruments<small></small></div>
          <div class="step" data-at="100"><span class="st"><svg viewBox="0 0 16 16"><path d="M3.5 8.4l3 3 6-6.4"/></svg></span>Finalizing your track<small></small></div>
        </div>
      </section>

      <div class="toast" id="toast"><i></i><span></span></div>
    </div>
    <div class="homebar"></div>
  </div></div></div>

  <div class="toolbar" aria-label="Prototype controls">
    <a href="index.html"><span class="n">01</span>Prompt</a>
    <a href="generating.html" class="on"><span class="n">02</span>Generate</a>
    <a href="player.html"><span class="n">03</span>Play</a>
    <span class="sep"></span>
    <button id="restartBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Restart demo</button>
    <button id="fsBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fullscreen</button>
  </div>
</div>

<script>
/* ───────── Shared helpers ───────── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=sessionStorage.getItem('riitm:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{sessionStorage.setItem('riitm:'+k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
function go(url){document.body.classList.add('leaving');setTimeout(()=>{location.href=url},400)}
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
let toastT;function toast(msg){const t=$('#toast');$('span',t).textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function fit(){const w=$('#wrap'),d=$('#device');
  if(matchMedia('(max-width:520px)').matches){w.style.width=w.style.height='';d.style.removeProperty('--scale');return}
  const s=Math.min(1,(innerHeight-96)/864,(innerWidth-32)/410);d.style.setProperty('--scale',s);w.style.width=410*s+'px';w.style.height=864*s+'px'}
addEventListener('resize',fit);fit();
function makeWaves(svg,w,h,bg,layers){
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  let out=bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:'';
  for(const L of layers){const P=L.period||w,step=P/48;let d=`M0 ${h+10}`;
    for(let x=0;x<=w+P+0.1;x+=step){const y=L.y+L.amp*Math.sin(2*Math.PI*x/P+(L.ph||0))+(L.amp2||0)*Math.sin(4*Math.PI*x/P+(L.ph||0)*1.7);d+=`L${x.toFixed(1)} ${y.toFixed(1)}`}
    out+=`<path d="${d}L${(w+P).toFixed(1)} ${h+10}Z" fill="${L.c}" style="--p:${-P}px;animation:waveSlide ${L.dur||10}s linear infinite${L.rev?' reverse':''}"/>`}
  svg.innerHTML=out}
// Brand wave (from the user's references): a mirrored sound wave, a white core inside blue, ink, lime and blue bands,
// whose peaks travel along it. Draws the desktop backdrop here and the home banner.
// o.amp: peak half-height as a share of the canvas height · o.base: band thickness scale · o.core: white core half-width (px)
// o.level(): 0…1 swell target (e.g. playing vs paused) · o.glow: paint the blue/lime glow inside the canvas
function brandWave(cv,o){
  o=Object.assign({amp:.4,base:1,core:1.4,speed:1,level:()=>1,glow:false,maxDpr:3},o);
  const ctx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W=0,H=0,dpr=1,t=0,last=0,level=o.level();
  const LAYERS=[['#0062FF',1,3.4],['#9DFF00',.74,2.6],['#000B1C',.52,1.9],['#0062FF',.36,1.5]];  // colour, share of peak height, base half-width
  // 0…1 amplitude along the wave: travelling bumps of different widths, so peaks rise and fall as they move
  const env=(u,ph)=>Math.min(1,(.07+.5*Math.pow(Math.sin(u*Math.PI*3.2+t*.9+ph)*.5+.5,4)
    +.75*Math.pow(Math.sin(u*Math.PI*1.6-t*.55+ph*1.9)*.5+.5,8)+.18*Math.pow(Math.sin(u*Math.PI*9.5+t*2.2+ph)*.5+.5,2))/1.15);
  function size(){const r=cv.getBoundingClientRect(),k=r.width/cv.offsetWidth||1;dpr=Math.min(o.maxDpr,Math.max(1,k)*(devicePixelRatio||1));
    W=cv.offsetWidth;H=cv.offsetHeight;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));draw()}
  function draw(){if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const c=H/2,A=H*o.amp*level,step=Math.max(3,W/480),n=Math.ceil(W/step),top=[],bot=[];
    for(let i=0;i<=n;i++){const u=i*step/W,e=env(u,0);top.push(e);bot.push(.55*e+.45*env(u,2.3))}
    LAYERS.forEach(([col,share,base],li)=>{
      ctx.shadowBlur=o.glow&&li<2?H*(li?.05:.08):0;ctx.shadowColor=li?'rgba(157,255,0,.35)':'rgba(0,98,255,.8)';
      ctx.beginPath();base*=o.base;
      for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-base-A*share*top[i]);
      for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+base+A*share*bot[i]);
      ctx.closePath();ctx.fillStyle=col;ctx.fill()});
    ctx.shadowBlur=0;ctx.beginPath();
    for(let i=0;i<=n;i++)ctx.lineTo(i*step,c-o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6)));
    for(let i=n;i>=0;i--)ctx.lineTo(i*step,c+o.core*(1+.36*Math.sin(i*step/W*Math.PI*6+t*1.6+1)));
    ctx.closePath();ctx.fillStyle='#FFFFFF';ctx.fill()}
  function frame(now){const dt=last?Math.max(0,Math.min(.1,(now-last)/1000)):0;last=now;
    if(cv.offsetWidth){level+=(o.level()-level)*Math.min(1,dt*3);t+=dt*o.speed*(.25+.75*level);draw()}   // hidden (phones): idle
    requestAnimationFrame(frame)}
  if(window.ResizeObserver)new ResizeObserver(size).observe(cv);size();
  if(!still)requestAnimationFrame(frame)}
brandWave($('#bgWave'),{amp:.3,base:6,core:7,speed:.5,glow:true,maxDpr:1.5});
$('#fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#restartBtn').onclick=()=>{try{sessionStorage.clear()}catch(e){}go('index.html')};
(function clock(){const c=$('#clock');if(!c)return;const tick=()=>{const d=new Date();c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,15000)})();

/* ───────── Page 2 ───────── */
makeWaves($('#bandWaves'),390,150,null,[
  {y:46,amp:14,amp2:6,c:'#9DFF00',period:390,dur:9,ph:.3},
  {y:62,amp:16,amp2:5,c:'#0062FF',period:390,dur:12,rev:1,ph:1.6},
  {y:84,amp:14,amp2:6,c:'#000B1C',period:390,dur:8,ph:2.6},
  {y:92,amp:14,amp2:6,c:'#0B0C10',period:390,dur:8,ph:2.6}]);

const mood=params.get('mood')||store.get('mood','Chill'),genre=params.get('genre')||store.get('genre','EDM'),dur=params.get('dur')||store.get('duration','1 min');
const variation=params.get('variation')==='1';
store.set('mood',mood);store.set('genre',genre);store.set('duration',dur);
const prompt=store.get('prompt','A chill electronic song about feeling free and enjoying the night');
if(variation){$('#title').innerHTML='Creating a<br>variation<span class="dots"><i>.</i><i>.</i><i>.</i></span>';$('#sub').textContent='Same vibe, new ideas — reimagining “Midnight Freedom”'}

const stepEls=$$('.step');
const stepMeta=[`${mood} · ${genre}`,'A minor · 112 BPM','Synths, drums, bass','Mixing & mastering'];
const stepLabel=['Analyzing','Composing','Arranging','Mastering'];
const tags=[[0,`<em>●</em> ${mood}`],[8,genre],[16,dur],[30,'A minor'],[42,'112 BPM']];

const meta=$('#meta');
tags.forEach(([,html])=>{const s=document.createElement('span');s.className='tag';s.innerHTML=html;meta.appendChild(s)});
const tagEls=$$('.tag',meta);

/* Natural-feeling progress curve: [seconds, percent] */
const KF=[[0,0],[.6,3],[1.3,11],[2.1,22],[2.6,26],[3.5,38],[4.2,49],[4.7,55],[5.4,60],[6.2,71],[6.9,80],[7.3,85],[7.9,91],[8.5,96],[8.9,98],[9.3,100]];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function pctAt(s){for(let i=1;i<KF.length;i++){if(s<=KF[i][0]){const[a,pa]=KF[i-1],[b,pb]=KF[i];return pa+(pb-pa)*ease((s-a)/(b-a))}}return 100}

const cv=$('#cv'),ctx=cv.getContext('2d'),vizBox=$('#viz');
let S=300,DPR=Math.min(2,devicePixelRatio||1);
function size(){const r=vizBox.getBoundingClientRect(),k=r.width/vizBox.offsetWidth||1;
  S=Math.max(180,Math.min(320,vizBox.offsetWidth-30,vizBox.offsetHeight+30));
  cv.style.width=cv.style.height=S+'px';cv.width=cv.height=Math.round(S*DPR*Math.max(1,k))}
new ResizeObserver(size).observe(vizBox);size();

const pctEl=$('#pct'),pctLabel=$('#pctLabel'),bar=$('#bar');
let start=null,last=-1,energy=0,finished=false,burst=0;
const hasConic=typeof ctx.createConicGradient==='function';

function draw(t,p){
  const W=cv.width,c=W/2,u=W/300;ctx.clearRect(0,0,W,W);
  const pulse=1+Math.sin(t*2.4)*.025+energy*.05+burst*.25;
  const R=64*u*pulse;
  ctx.save();ctx.globalCompositeOperation='lighter';
  let grad;
  if(hasConic){grad=ctx.createConicGradient(t*.35,c,c);grad.addColorStop(0,'#B6FF38');grad.addColorStop(.3,'#0062FF');grad.addColorStop(.55,'#2A7BFF');grad.addColorStop(.78,'#B6FF38');grad.addColorStop(1,'#B6FF38')}
  else{grad=ctx.createLinearGradient(0,0,W,W);grad.addColorStop(0,'#B6FF38');grad.addColorStop(1,'#0062FF')}
  ctx.strokeStyle=grad;
  const N=34,steps=140,amp=(9+energy*10+burst*20)*u;
  for(let i=0;i<N;i++){
    const f=i/(N-1);ctx.globalAlpha=(.08+.55*Math.pow(Math.sin(f*Math.PI),1.4))*(1-burst*.5);
    ctx.lineWidth=(f>.42&&f<.58?1.6:1)*u;
    ctx.beginPath();
    for(let k=0;k<=steps;k++){
      const a=k/steps*Math.PI*2;
      const r=R+f*44*u+amp*(Math.sin(5*a+t*1.1+f*2.6)*.75+Math.sin(3*a-t*.7+f*4)*.35+Math.sin(8*a+t*1.9)*.12*energy);
      const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.stroke()}
  ctx.restore();
  // inner disc
  const g2=ctx.createRadialGradient(c,c,0,c,c,R*1.05);g2.addColorStop(0,'#0B0C10');g2.addColorStop(.82,'#0B0C10');g2.addColorStop(1,'rgba(11,12,16,0)');
  ctx.fillStyle=g2;ctx.beginPath();ctx.arc(c,c,R*1.05,0,Math.PI*2);ctx.fill();
  // progress arc
  ctx.lineCap='round';ctx.lineWidth=2.2*u;ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.arc(c,c,R*.88,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#B6FF38';ctx.shadowColor='#B6FF38';ctx.shadowBlur=12*u;ctx.beginPath();ctx.arc(c,c,R*.88,-Math.PI/2,-Math.PI/2+Math.PI*2*p/100);ctx.stroke();ctx.shadowBlur=0;
  // orbiting particles
  for(let i=0;i<10;i++){const a=t*(.25+i*.04)+i*2.1,rr=R+(30+((i*37)%40))*u+Math.sin(t+i)*6*u;
    ctx.globalAlpha=.35+.35*Math.sin(t*2+i);ctx.fillStyle=i%3?'#B6FF38':'#5B9BFF';ctx.beginPath();ctx.arc(c+Math.cos(a)*rr,c+Math.sin(a)*rr,(1+(i%3)*.6)*u,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1}

function setSteps(p){
  let activeIdx=stepEls.findIndex(s=>p<+s.dataset.at);if(p>=100)activeIdx=-1;
  stepEls.forEach((s,i)=>{const done=p>=+s.dataset.at,active=i===activeIdx;
    s.classList.toggle('done',done);s.classList.toggle('active',active);
    if(done||active)$('small',s).textContent=done?stepMeta[i]:'Working…'});
  if(activeIdx>=0)pctLabel.textContent=stepLabel[activeIdx];
  tagEls.forEach((el,i)=>el.classList.toggle('in',p>=tags[i][0]))}

function frame(now){
  if(start==null)start=now;
  const s=(now-start)/1000-.55,t=now/1000;
  const p=finished?100:Math.max(0,Math.min(100,pctAt(Math.max(0,s))));
  const target=p>=22&&p<85?1:p<22?.4:.6;energy+=(target-energy)*.03;
  if(finished)burst=Math.min(.6,burst+.015);
  draw(t,p);
  const n=Math.floor(p);
  if(n!==last){last=n;pctEl.textContent=n;bar.style.width=p+'%';setSteps(p)}
  if(p>=100&&!finished){finished=true;complete()}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);

function complete(){
  $('#pctBox').classList.add('pop');pctLabel.textContent='Ready';
  const h=$('#title');h.classList.add('done');h.innerHTML=variation?'Variation<br>is ready':'Your track<br>is ready';
  $('#sub').textContent=`“${prompt.length>60?prompt.slice(0,58)+'…':prompt}”`;
  setTimeout(()=>go('player.html'+(variation?'?variation=1':'')),1500)}

$('#closeBtn').onclick=()=>go('index.html?demo=0');
</script>
</body>
</html>
