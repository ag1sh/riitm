<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riitm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>riitm — Bukhara Nights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────── Shared tokens & device frame (identical in every page) ───────── */
:root{
  --bg:#0B0C10; --card:#14161D; --card-2:#1A1D26; --field:#0F1116;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#F4F6F8; --muted:#8C93A1; --dim:#5D6370;
  --lime:#B6FF38; --lime-brand:#9DFF00; --blue:#0062FF; --ink:#000B1C;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:'Archivo','Inter',system-ui,sans-serif;   /* stand-in for Halvar Breitschrift: use with font-stretch:108–125% */
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0B0C10}
body{height:100vh;height:100dvh;overflow:hidden;font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.stage-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.stage-bg svg{width:100%;height:100%}
.stage-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 55% at 50% 48%,rgba(11,12,16,.7),rgba(11,12,16,.25) 75%)}
.device-wrap{position:relative;z-index:1;width:410px;height:864px;flex:none}
.device{position:absolute;left:0;top:0;width:410px;height:864px;padding:10px;border-radius:60px;
  background:linear-gradient(150deg,#3b3e47,#121318 28%,#0a0b0e 70%,#2b2e36);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 50px 120px -30px rgba(0,0,0,.9),0 0 0 1px #000;
  transform:scale(var(--scale,1));transform-origin:0 0}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);isolation:isolate}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.statusbar{flex:none;height:50px;padding:17px 30px 0 38px;display:flex;justify-content:space-between;font:600 15px var(--fb);letter-spacing:-.01em;position:relative;z-index:5}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:60;pointer-events:none}
.hdr{flex:none;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
.logo{display:block;height:26px}
.logo svg{height:26px;width:auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(255,255,255,.03);transition:background .2s,transform .2s var(--ease)}
.icon-btn:hover{background:rgba(255,255,255,.07)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(11,12,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.toolbar a,.toolbar button{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--fb);color:var(--muted);text-decoration:none;transition:color .2s,background .2s;white-space:nowrap}
.toolbar a:hover,.toolbar button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.toolbar a.on{background:var(--lime);color:#0B0C10}
.toolbar .n{font-variant-numeric:tabular-nums;opacity:.55}
.toolbar .sep{width:1px;height:18px;background:var(--line-2);margin:0 4px}
.toolbar svg{width:15px;height:15px}
.toast{position:absolute;left:50%;bottom:112px;z-index:70;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:86%;
  padding:11px 16px;border-radius:16px;background:rgba(26,29,38,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line-2);font:500 13px var(--fb);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transition:opacity .3s,transform .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);flex:none}
.reveal{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0) * 75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
body.leaving .app{animation:leave .42s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:scale(.965);filter:blur(6px)}}
@keyframes waveSlide{to{transform:translateX(var(--p))}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .stage{display:block}
  .stage-bg,.toolbar,.statusbar,.homebar{display:none}
  .device-wrap{width:100%!important;height:100%!important}
  .device{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .screen{border-radius:0}
  .app{padding-top:max(env(safe-area-inset-top),8px);padding-bottom:env(safe-area-inset-bottom)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ───────── This page ───────── */
/* ───────── v2 shared components ───────── */
/* Slim dark scrollbars wherever something does scroll (replaces the grey browser default) */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
.hdr.bar{display:grid;grid-template-columns:44px 1fr 44px;padding:0 14px}
.hdr.bar>:first-child{justify-self:start}.hdr.bar>:last-child{justify-self:end}
.hdr.bar .mid{justify-self:center;display:flex;align-items:center}
.hdr .h-title{font:600 17px var(--fb);letter-spacing:-.01em}
.hdr .logo.small,.hdr .logo.small svg{height:22px}
.ghost{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s var(--ease)}
.ghost:hover{background:rgba(255,255,255,.07)}
.ghost:active{transform:scale(.9)}
.ghost svg{width:23px;height:23px}
.dot-badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FF3D3D;color:#fff;font:700 10px/16px var(--fb);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.icon-btn{position:relative}
.tap{transform:scale(.93)!important;transition:transform .12s!important}
.ripple{position:absolute;border-radius:50%;background:rgba(11,12,16,.22);transform:scale(0);animation:ripple .7s var(--ease) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.btn-lime{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:999px;background:var(--lime);color:#0B0C10;font:600 16.5px var(--fb);
  box-shadow:0 14px 36px -14px rgba(182,255,56,.7);transition:transform .25s var(--ease),box-shadow .3s}
.btn-lime:active{transform:scale(.96)}
.btn-lime svg{width:20px;height:20px}
.btn-line{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;border:1px solid var(--line-2);font:500 15.5px var(--fb);transition:background .2s,transform .2s var(--ease)}
.btn-line:hover{background:rgba(255,255,255,.05)}
.btn-line:active{transform:scale(.97)}

/* Tab bar */
.tabbar{flex:none;display:flex;justify-content:space-around;padding:8px 10px 26px;border-top:1px solid var(--line);background:rgba(11,12,16,.96);position:relative;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;font:500 11px var(--fb);color:var(--muted);transition:color .2s}
.tab svg{width:24px;height:24px}
.tab .ti{height:30px;display:grid;place-items:center}
.tab.on{color:var(--lime)}
.tab:not(.on):hover{color:var(--text)}
@media (max-width:520px){.tabbar{padding-bottom:max(12px,env(safe-area-inset-bottom))}}

/* Bottom sheets */
.sheet-bg{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:81;padding:6px 10px 18px;border-radius:28px;background:#15171E;border:1px solid var(--line-2);
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.8);transform:translateY(115%);transition:transform .45s var(--ease)}
.sheet.open{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:4px auto 6px}
.sheet .s-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:48px;margin-bottom:4px}
.sheet .s-head b{grid-column:2;text-align:center;font:600 16px var(--fb)}
.sheet .s-head .ghost{grid-column:3}
.sheet .s-head .ghost.back{grid-column:1;grid-row:1}
.sheet .s-head svg{width:20px;height:20px}
.s-list{border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);overflow:hidden}
.s-row{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 14px;font:500 15px var(--fb);text-align:left;transition:background .2s}
.s-row+.s-row{border-top:1px solid var(--line)}
.s-row:hover{background:rgba(255,255,255,.05)}
.s-row>svg:first-child{width:21px;height:21px;color:#C9CED6;flex:none}
.s-row .chev{margin-left:auto;width:18px;height:18px;color:var(--dim)}
.s-row .val{margin-left:auto;font:500 13.5px var(--fb);color:var(--muted)}
.s-row .check{margin-left:auto;width:20px;height:20px;color:var(--lime);opacity:0}
.s-row.sel .check{opacity:1}
.s-row.sel{color:var(--lime)}
.s-row.danger,.s-row.danger>svg:first-child{color:#FF5C5C}
.share-row{display:flex;justify-content:space-between;padding:8px 6px 4px}
.share-row button{display:flex;flex-direction:column;align-items:center;gap:8px;width:60px;font:500 11.5px var(--fb);color:#C9CED6}
.share-row .sc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--ease)}
.share-row button:active .sc{transform:scale(.9)}
.share-row .sc svg{width:24px;height:24px}
.field-in{width:100%;height:50px;padding:0 16px;border-radius:14px;background:var(--field);border:1px solid var(--line-2);color:var(--text);font:500 15.5px var(--fb);outline:0}
.field-in:focus{border-color:rgba(182,255,56,.55);box-shadow:0 0 0 4px rgba(182,255,56,.08)}

.app{background:linear-gradient(180deg,var(--pbg,#0E3F5A) 0%,color-mix(in srgb,var(--pbg,#0E3F5A) 45%,#0B0C10) 42%,#0B0C10 82%);transition:background 1s}
.hdr.bar .logo.small{opacity:.9}
.art-wrap{position:relative;margin:4px 18px 0;perspective:900px}
.art{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;transition:transform .5s var(--ease);box-shadow:0 30px 60px -24px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.art svg{width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%)}
.unmute{position:absolute;left:50%;bottom:14px;transform:translate(-50%,0);z-index:3;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 11px;border-radius:999px;white-space:nowrap;
  background:rgba(11,12,16,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);font:600 12px var(--fb);transition:opacity .4s,transform .4s var(--ease)}
.unmute svg{width:16px;height:16px;color:var(--lime)}
.unmute.hide{opacity:0;transform:translate(-50%,8px);pointer-events:none}
.meta{display:flex;align-items:center;gap:6px;margin:16px 18px 0}
.meta .tt{flex:1;min-width:0}
.meta h1{font:800 23px/1.15 var(--fd);font-stretch:104%;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin-top:4px;font:500 13px var(--fb);color:#B9C2CF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;margin:16px 18px 0;height:22px;cursor:pointer;touch-action:none}
.prog .rail{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.prog .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--lime);box-shadow:0 0 12px rgba(182,255,56,.5)}
.prog .knob{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(182,255,56,.18);transition:transform .15s}
.prog:active .knob{transform:scale(1.3)}
.times{display:flex;justify-content:space-between;margin:2px 18px 0;font:500 12px var(--fb);color:#B9C2CF;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:8px}
.ctl{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.ctl:hover{background:rgba(255,255,255,.06)}
.ctl:active{transform:scale(.88)}
.ctl svg{width:28px;height:28px;fill:#fff}
.play{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 14px 34px -10px rgba(255,255,255,.35);transition:transform .2s var(--ease)}
.play:active{transform:scale(.93)}
.play svg{width:28px;height:28px;fill:#0B0C10;position:absolute;transition:opacity .25s,transform .35s var(--ease)}
.play{position:relative}
.play .i-play{transform:translateX(2px) scale(.4);opacity:0}
.play.paused .i-play{transform:translateX(2px);opacity:1}
.play.paused .i-pause{transform:scale(.4);opacity:0}
.row4{display:flex;justify-content:space-between;margin:12px 22px 0}
.tg{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#C9CED6;transition:color .2s,transform .2s var(--ease)}
.tg:active{transform:scale(.88)}
.tg svg{width:24px;height:24px}
.tg.on{color:var(--lime)}
.tg.on .fillme{fill:var(--lime)}
.tg.on::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lime)}
#likeBtn.on::after{display:none}
.tg.pop{animation:popc .45s var(--ease)}
@keyframes popc{40%{transform:scale(1.25)}}
.burst{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--lime);pointer-events:none;animation:burst .6s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 18px 26px}
.duo button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:66px;border-radius:18px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font:500 13px var(--fb);transition:background .2s,transform .2s var(--ease)}
.duo button:hover{background:rgba(255,255,255,.08)}
.duo button:active{transform:scale(.96)}
.duo svg{width:21px;height:21px}
.share-row .sc.link{background:#3A3D46}
.share-row .sc.tgm{background:#229ED9}
.share-row .sc.wa{background:#25D366}
.share-row .sc.ig{background:radial-gradient(circle at 30% 110%,#FFD600,#FF7A00 30%,#FF0069 60%,#D300C5 80%,#7638FA)}
.share-row .sc.more{background:#3A3D46}
.share-row .sc svg{color:#fff;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

</style>
</head>
<body>
<div class="stage">
  <div class="stage-bg" aria-hidden="true"><svg id="bgWaves"></svg></div>

  <div class="device-wrap" id="wrap"><div class="device" id="device"><div class="screen">
    <div class="app" id="app">
      <div class="statusbar"><span id="clock">9:41</span><span class="sys">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9L4.4 7c1-.9 2.2-1.4 3.6-1.4zM8 9a1.7 1.7 0 0 0-1.2.5L8 10.8l1.2-1.3A1.7 1.7 0 0 0 8 9z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".45"/></svg>
      </span></div>

<script>
/* ───────── Shared helpers (identical in every page) ───────── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
// Flow state between pages. Storage can throw (private mode, blocked site data), so every access is guarded.
const store={get(k,d){try{const v=sessionStorage.getItem('riitm:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{sessionStorage.setItem('riitm:'+k,JSON.stringify(v))}catch(e){}}};
const params=new URLSearchParams(location.search);
// Page-to-page transition: play the leave animation, then load the next file.
function go(url){document.body.classList.add('leaving');setTimeout(()=>{location.href=url},400)}
addEventListener('pageshow',e=>{if(e.persisted)document.body.classList.remove('leaving')});
let toastT;function toast(msg){const t=$('#toast');$('span',t).textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
// Desktop: scale the 410×864 device to fit the window. Phones (≤520px): full-bleed, no frame.
function fit(){const w=$('#wrap'),d=$('#device');
  if(matchMedia('(max-width:520px)').matches){w.style.width=w.style.height='';d.style.removeProperty('--scale');return}
  const s=Math.min(1,(innerHeight-96)/864,(innerWidth-32)/410);d.style.setProperty('--scale',s);w.style.width=410*s+'px';w.style.height=864*s+'px'}
addEventListener('resize',fit);fit();
// Brand "every wave" stripes: stacked sine bands that slide seamlessly (each path is one period wider than the view).
function makeWaves(svg,w,h,bg,layers){
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  let out=bg?`<rect width="${w}" height="${h}" fill="${bg}"/>`:'';
  for(const L of layers){const P=L.period||w,step=P/48;let d=`M0 ${h+10}`;
    for(let x=0;x<=w+P+0.1;x+=step){const y=L.y+L.amp*Math.sin(2*Math.PI*x/P+(L.ph||0))+(L.amp2||0)*Math.sin(4*Math.PI*x/P+(L.ph||0)*1.7);d+=`L${x.toFixed(1)} ${y.toFixed(1)}`}
    out+=`<path d="${d}L${(w+P).toFixed(1)} ${h+10}Z" fill="${L.c}" style="--p:${-P}px;animation:waveSlide ${L.dur||10}s linear infinite${L.rev?' reverse':''}"/>`}

  traditional:{drums:'none',doira:1.2,pad:.4,drone:1,crackle:0,swing:.1,lp:10000},
  lofi:       {drums:'lofi',doira:.4,pad:1.1,drone:0,crackle:1,swing:.2,lp:3200}}[version];

  init(){if(this.ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;const c=this.ctx=new AC();

    const wet=c.createGain();wet.gain.value=.28;dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(wet);wet.connect(this.master);this.dl=dl;
    const len=c.sampleRate*2.4,ir=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}

  mtof:m=>440*Math.pow(2,(m-69)/12),

    while(this.next<c.currentTime+.14){const sw=this.step%2?ARR.swing*s16:0;this.play(this.step,this.next+sw);this.next+=s16;this.step=(this.step+1)%64}},

    if(!intro&&!brk&&!outro&&(s===0||s===8||s===11))this.bass(t,ch.b,s===0?.5:.22);

  dum(t,v){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(78,t+.08);this.env(g,t,v,.002,.22);o.connect(g);this.out(g,1,.2);o.start(t);o.stop(t+.3)},
  tak(t,v){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='bandpass';f.frequency.value=5200;f.Q.value=3;this.env(g,t,v,.001,.14);s.connect(f);f.connect(g);this.out(g,1,.25);s.start(t,Math.random()*.5);s.stop(t+.2)},
  bass(t,m,d){const c=this.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='triangle';o.frequency.value=this.mtof(m);f.type='lowpass';f.frequency.value=420;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.5,t+.015);g.gain.setTargetAtTime(.0001,t+d,.06);o.connect(f);f.connect(g);this.out(g);o.start(t);o.stop(t+d+.5)},
  pad(t,notes,d,v){const c=this.ctx,f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.setValueAtTime(600,t);f.frequency.linearRampToValueAtTime(1300,t+d*.5);f.frequency.linearRampToValueAtTime(700,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.032*v,t+.8);g.gain.setTargetAtTime(.0001,t+d-.2,.4);
    notes.forEach(m=>[-6,6].forEach(det=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=this.mtof(m);o.detune.value=det;o.connect(f);o.start(t);o.stop(t+d+1.8)}));f.connect(g);this.out(g,.8,.9)},
  dronev(t,m,d){const c=this.ctx,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o2.type='sawtooth';o.frequency.value=this.mtof(m);o2.frequency.value=this.mtof(m+7);f.type='lowpass';f.frequency.value=500;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.setTargetAtTime(.0001,t+d-.1,.3);o.connect(f);o2.connect(f);f.connect(g);this.out(g,1,.5);o.start(t);o2.start(t);o.stop(t+d+1.2);o2.stop(t+d+1.2)},
  // Rubab-like pluck: bright saw, body resonance, tiny pitch fall on the attack. Non-ethno tracks get a softer synth pluck.
  rubab(t,m,v){const c=this.ctx,o=c.createOscillator(),bp=c.createBiquadFilter(),lp=c.createBiquadFilter(),g=c.createGain();
    o.type=ETHNO?'sawtooth':'triangle';o.frequency.setValueAtTime(this.mtof(m)*1.018,t);o.frequency.exponentialRampToValueAtTime(this.mtof(m),t+.035);
    bp.type='peaking';bp.frequency.value=1700;bp.gain.value=ETHNO?9:2;bp.Q.value=1.4;lp.type='lowpass';lp.frequency.setValueAtTime(ETHNO?5200:3000,t);lp.frequency.exponentialRampToValueAtTime(900,t+.3);
    this.env(g,t,(ETHNO?.11:.14)*v,.003,ETHNO?.45:.35);o.connect(bp);bp.connect(lp);lp.connect(g);this.out(g,.85,.3,.45);o.start(t);o.stop(t+.6)},
  crackle(t){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type='highpass';f.frequency.value=3000;this.env(g,t+Math.random()*.1,.04+Math.random()*.05,.0005,.006);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random()*.9);s.stop(t+.12)},
  level(){if(!this.ctx||this.ctx.state!=='running')return null;this.an.getByteFrequencyData(this.bins);let s=0;for(let i=1;i<7;i++)s+=this.bins[i];return Math.min(1,Math.max(0,(s/6-110)/120))},
  async on(){if(!this.init())return false;try{await Promise.race([this.ctx.resume(),new Promise(r=>setTimeout(r,350))])}catch(e){}
    if(this.ctx.state!=='running')return false;this.master.gain.cancelScheduledValues(this.ctx.currentTime);this.master.gain.setTargetAtTime(.85,this.ctx.currentTime,.12);return true},
  off(){if(!this.ctx||this.ctx.state!=='running')return;const c=this.ctx;this.master.gain.cancelScheduledValues(c.currentTime);this.master.gain.setTargetAtTime(0,c.currentTime,.04);
    clearTimeout(this.sus);this.sus=setTimeout(()=>{if(!Player.playing)c.suspend()},180)}};
const _go=go;go=url=>{Player.playing=false;Synth.off();_go(url)};

/* ── Player state ── */
const playBtn=$('#playBtn'),unmute=$('#unmute');
const Player={pos:0,dur:V.dur,playing:true,repeat:false,audio:false,
  setPlaying(p){this.playing=p;playBtn.classList.toggle('paused',!p);if(p){if(this.audio)Synth.on()}else Synth.off()},
  async enableAudio(){if(this.audio)return;const ok=await Synth.on();if(ok){this.audio=true;unmute.classList.add('hide');if(!this.playing)Synth.off()}}};

let seeking=false,lastT=performance.now();
const fill=$('#fill'),knob=$('#knob'),cur=$('#cur'),rem=$('#rem');
function loop(now){const dt=Math.max(0,Math.min(.1,(now-lastT)/1000));lastT=now;
  if(Player.playing&&!seeking){Player.pos+=dt;if(Player.pos>=Player.dur){Player.pos=0;if(!Player.repeat){Player.setPlaying(false);toast('Track finished — tap play to listen again')}}}
  const p=Player.pos/Player.dur;fill.style.width=knob.style.left=(p*100)+'%';cur.textContent=fmt(Player.pos);rem.textContent='-'+fmt(Player.dur-Player.pos);
  if(Player.playing)updateArt(Player.pos,Player.audio?Synth.level():null,BPM);
  requestAnimationFrame(loop)}
updateArt(0,null,BPM);requestAnimationFrame(loop);

setTimeout(async()=>{await Player.enableAudio();if(!Player.audio&&Player.playing)unmute.classList.remove('hide')},900);
$('#app').addEventListener('pointerdown',e=>{if(e.isTrusted&&!Player.audio)Player.enableAudio()},{capture:true});
unmute.onclick=()=>{Player.enableAudio();if(!Player.playing)Player.setPlaying(true)};
playBtn.onclick=()=>Player.setPlaying(!Player.playing);
$('#prevBtn').onclick=()=>{Player.pos=0;toast('Back to the start')};
$('#nextBtn').onclick=()=>toast('Up next: My riitm mix');
$('#queueBtn').onclick=()=>toast(`Queue: ${trackTitle()} → My riitm mix`);

/* Seek */
const prog=$('#prog');
function seekTo(e){const r=prog.getBoundingClientRect();Player.pos=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*Player.dur;updateArt(Player.pos,null,BPM)}
prog.addEventListener('pointerdown',e=>{seeking=true;prog.setPointerCapture(e.pointerId);seekTo(e)});
prog.addEventListener('pointermove',e=>{if(seeking)seekTo(e)});
['pointerup','pointercancel'].forEach(ev=>prog.addEventListener(ev,()=>seeking=false));
prog.addEventListener('keydown',e=>{if(e.key==='ArrowRight')Player.pos=Math.min(Player.dur,Player.pos+5);if(e.key==='ArrowLeft')Player.pos=Math.max(0,Player.pos-5)});

/* Toggles */
function burst(btn){for(let i=0;i<10;i++){const a=i/10*Math.PI*2,s=document.createElement('span');s.className='burst';s.style.setProperty('--x',Math.cos(a)*30+'px');s.style.setProperty('--y',Math.sin(a)*30+'px');btn.appendChild(s);setTimeout(()=>s.remove(),650)}}
function pop(b){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
const likeBtn=$('#likeBtn');likeBtn.classList.toggle('on',store.get('liked',false));
likeBtn.onclick=()=>{const on=likeBtn.classList.toggle('on');store.set('liked',on);pop(likeBtn);if(on){burst(likeBtn);toast('Added to Liked songs')}};
$('#repeatBtn').onclick=e=>{Player.repeat=e.currentTarget.classList.toggle('on');pop(e.currentTarget);toast(Player.repeat?'Repeat track on':'Repeat off')};
$('#shuffleBtn').onclick=e=>{const on=e.currentTarget.classList.toggle('on');pop(e.currentTarget);toast(on?'Shuffle on':'Shuffle off')};
$('#saveBtn').onclick=e=>{const on=e.currentTarget.classList.toggle('on');pop(e.currentTarget);toast(on?'Saved to My Music':'Removed from My Music')};

/* Sheets */
$('#shareBtn').onclick=()=>Sheet.open('shareSheet');
$('#moreBtn').onclick=()=>Sheet.open('options');
$('#versionBtn').onclick=()=>Sheet.open('versions');
$('#editBtn').onclick=()=>go('create.html?edit=1');
$('#downBtn').onclick=()=>go('library.html');
$$('#versions .s-row').forEach(r=>r.onclick=()=>{Sheet.close();go('generating.html?version='+r.dataset.v)});
$$('#shareSheet [data-s]').forEach(b=>b.onclick=async()=>{const k=b.dataset.s,url=location.href.split('?')[0];
  if(k==='link'){try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){toast('Link: riitm.app/t/bukhara-nights')}}
  else if(k==='more'){try{if(navigator.share){await navigator.share({title:trackTitle()+' — made with riitm AI',url});return}}catch(e){if(e&&e.name==='AbortError')return}toast('Sharing isn’t available in this browser')}
  else toast(`Opening ${k}…`);
  Sheet.close()});
let delArmed=false;
$$('#options .s-row').forEach(r=>r.onclick=()=>{const o=r.dataset.o;
  if(o==='rename'){$('#renameIn').value=trackTitle();Sheet.open('renameSheet');setTimeout(()=>$('#renameIn').select(),350)}
  else if(o==='style'){Sheet.close();go('create.html?edit=1')}
  else if(o==='version')Sheet.open('versions');
  else if(o==='delete'){if(!delArmed){delArmed=true;$('#delLbl').textContent='Tap again to delete';setTimeout(()=>{delArmed=false;$('#delLbl').textContent='Delete'},3000)}
    else{const list=store.get('tracks',[]);list.shift();store.set('tracks',list);store.set('deleted',trackTitle());Sheet.close();go('library.html')}}});
function saveRename(){const v=$('#renameIn').value.trim();if(!v)return;store.set('title',v);
  const list=store.get('tracks',[]);if(list[0]){list[0].title=v;store.set('tracks',list)}renderMeta();Sheet.close();toast('Renamed to “'+v+'”')}
$('#renameSave').onclick=saveRename;$('#renameIn').addEventListener('keydown',e=>{if(e.key==='Enter')saveRename()});

/* Tour: show off sharing, options and versions, then minimise to My Music */
if(Demo.active()&&version==='base'){
  Demo.onStop=()=>Sheet.close();
  Demo.run(async()=>{
    await Demo.wait(5200);tapFx($('#shareBtn'));Sheet.open('shareSheet');
    await Demo.wait(2400);Sheet.close();
    await Demo.wait(700);tapFx($('#moreBtn'));Sheet.open('options');
    await Demo.wait(2400);Sheet.close();
    await Demo.wait(700);tapFx($('#versionBtn'));Sheet.open('versions');
    await Demo.wait(2600);Sheet.close();
    await Demo.wait(800);tapFx($('#downBtn'));
    await Demo.wait(200);go('library.html');
  });
}
if(params.get('sheet')==='versions')setTimeout(()=>Sheet.open('versions'),700);

</script>
</body>
</html>
